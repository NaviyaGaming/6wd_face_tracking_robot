<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Robot Eye</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root{--bg:#0a0a0f;--panel:#12121a;--border:#1e1e2e;
        --accent:#00c8ff;--accent2:#7c3aed;--green:#22c55e;
        --text:#e2e8f0;--muted:#64748b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
       min-height:100dvh;display:flex;flex-direction:column;align-items:center;
       padding:24px 16px;gap:16px}
  h1{font-size:1.3rem;font-weight:700;letter-spacing:5px;text-transform:uppercase;
     background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:.65rem;letter-spacing:3px;color:var(--muted)}
  .cam-wrap{width:100%;max-width:400px;border-radius:16px;overflow:hidden;
            border:1px solid var(--border);background:#000}
  video{width:100%;display:block}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
        padding:14px 18px;width:100%;max-width:400px;text-align:center}
  .lbl{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .pid{font-size:1.1rem;font-weight:700;color:var(--accent);letter-spacing:3px;word-break:break-all}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:6px 18px;
         border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:2px;
         border:1px solid var(--border);background:var(--panel)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  .note{font-size:.65rem;color:var(--muted);text-align:center;letter-spacing:1px;
        max-width:340px;line-height:1.6}
</style>
</head>
<body>

<h1>📷 Robot Eye</h1>
<p class="sub">Phone A · Camera Only · Stream to Controller</p>

<!-- Status -->
<div class="badge">
  <div class="dot" id="dot"></div>
  <span id="statusLabel">WAITING FOR CONTROLLER…</span>
</div>

<!-- Peer ID to share -->
<div class="card">
  <div class="lbl">Share this ID with Controller Phone</div>
  <div class="pid" id="myPeerId">Starting…</div>
</div>

<!-- Live preview -->
<div class="cam-wrap">
  <video id="video" autoplay muted playsinline></video>
</div>

<p class="note">
  This phone only streams the camera.<br>
  All face detection and robot control<br>
  happens on the controller phone.
</p>

<script>
const video = document.getElementById('video');
let localStream = null;

// ── Start camera (rear-facing, high res) ──────────────────────────────
async function startCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = localStream;
  } catch(e) {
    document.getElementById('statusLabel').textContent = 'CAMERA ERROR: ' + e.message;
  }
}

// ── PeerJS — answer any call with camera stream ───────────────────────
function initPeer() {
  const peer = new Peer();

  peer.on('open', id => {
    document.getElementById('myPeerId').textContent = id;
  });

  peer.on('call', call => {
    call.answer(localStream);   // send camera stream to whoever calls
    document.getElementById('dot').className = 'dot on';
    document.getElementById('statusLabel').textContent = 'STREAMING ✓';

    call.on('close', () => {
      document.getElementById('dot').className = 'dot';
      document.getElementById('statusLabel').textContent = 'CONTROLLER DISCONNECTED';
    });
  });

  peer.on('error', e => {
    document.getElementById('statusLabel').textContent = 'PEER ERROR: ' + e.type;
  });
}

// ── Boot ──────────────────────────────────────────────────────────────
(async () => {
  await startCamera();
  initPeer();
})();
</script>
</body>
</html>
